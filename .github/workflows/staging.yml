name: Deploy staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: cms
            dockerfile: apps/cms/Dockerfile
          - name: commerce
            dockerfile: apps/commerce/Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cera-${{ matrix.name }}:${{ github.sha }}

  deploy:
    name: Deploy staging
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/cera_deploy
          chmod 0600 ~/.ssh/cera_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy recorded commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
        run: |
          ssh -i ~/.ssh/cera_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/cera && CERA_IMAGE_PREFIX='$IMAGE_PREFIX' bash infra/scripts/deploy.sh staging '${{ github.sha }}'"
