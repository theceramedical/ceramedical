name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CMS_DATABASE_URL: postgresql://cera_ci:cera_ci@127.0.0.1:5432/cera_ci
      PAYLOAD_SECRET: ci-only-not-a-production-secret-value
      SUPERADMIN_PASSWORD: ci-only-password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cera_ci
          POSTGRES_PASSWORD: cera_ci
          POSTGRES_USER: cera_ci
        options: >-
          --health-cmd "pg_isready -U cera_ci -d cera_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build applications
        run: pnpm build
