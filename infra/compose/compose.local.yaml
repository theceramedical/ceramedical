name: cera-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-local-password}
      POSTGRES_USER: ${POSTGRES_USER:-cera_local}
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cera_local} -d postgres']
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init-local.sql:/docker-entrypoint-initdb.d/10-cera-databases.sql:ro

  valkey:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --appendonly
      - 'yes'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - '127.0.0.1:6379:6379'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - valkey-data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '127.0.0.1:${SMTP_PORT:-1125}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8125}:8025'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  valkey-data:
